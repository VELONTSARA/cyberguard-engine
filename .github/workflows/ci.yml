name: CyberGuard Engine CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code sur le serveur GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configuration de Python 3.11
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Installation des dépendances
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest httpx

      # 4. Exécution du pipeline MLOps (Entraînement & Évaluation)
      - name: Train and Evaluate ML Model
        run: |
          python -m src.download_data
          python -m src.train
          python -m src.evaluate

      # 5. Exécution des 6 tests d'intégration Pytest
      - name: Run Pytest Suite
        run: |
          pytest -v