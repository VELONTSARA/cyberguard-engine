name: CyberGuard Engine CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupérer le code source
        uses: actions/checkout@v4

      - name: 2. Configurer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 3. Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # --- ÉTAPE DE SÉCURITÉ : Génération des artefacts si non présent dans Git ---
      - name: 4. Entraîner le modèle (génération des .pkl)
        run: |
          python train.py

      - name: 5. Exécuter les tests unitaires avec Pytest
        run: |
          pytest --verbose